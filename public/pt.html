<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PT photos</title>
<style>
  :root { --ink:#202124; --sub:#5f6368; --line:#dadce0; --bg:#f1f3f4; --brand:#f29900; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { margin: 0; font-size: 24px; letter-spacing: .5px; }
  .meta { color: var(--sub); font-size: 13px; flex: 1 1 200px; }
  button { height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font: 700 15px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; }
  main { padding: 12px 16px 40px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .grid a { position: relative; display: block; aspect-ratio: 4/3; background: #ddd; border-radius: 6px; overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid span { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
  .msg { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-top: 20px; text-align: center; }
  .hint { color: var(--sub); font-size: 13px; margin: 0 0 10px; }
  #view { position: fixed; inset: 0; z-index: 5; background: #000; display: none; }
  #view.on { display: block; }
  #view .wrap { position: absolute; inset: 0; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
  #view img { display: block; max-width: none; width: 100%; height: auto; min-height: 100%; object-fit: contain; }
  #view img.full { width: auto; }
  #view .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; padding: 10px; justify-content: space-between; }
  #view .bar button, #view .bar a { height: 40px; padding: 0 14px; border-radius: 8px; background: rgba(0,0,0,.6); border: 1px solid #fff; color: #fff; font: 700 14px system-ui, sans-serif; display: inline-flex; align-items: center; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1 id="reg">PT photos</h1>
  <div class="meta" id="meta">Loading…</div>
  <button type="button" id="all" disabled>Download all</button>
</header>
<main>
  <p class="hint" id="hint"></p>
  <div class="grid" id="grid"></div>
</main>
<div id="view" role="dialog" aria-label="Photo">
  <div class="wrap"><img id="big" alt=""></div>
  <div class="bar"><button type="button" id="prev">‹</button><span><button type="button" id="zoom">Zoom</button> <a id="save" href="#">Save</a> <button type="button" id="close">✕</button></span><button type="button" id="next">›</button></div>
</div>
<script src="/vendor/jszip-3.10.1.min.js"></script>
<script src="/pt.js"></script>
</body>
</html>
